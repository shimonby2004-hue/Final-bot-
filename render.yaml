services:
  - type: web
    name: cyber-marketing-bot
    env: node
    plan: free
    buildCommand: npm install && npx prisma generate && npx prisma db push
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: BOT_TOKEN
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: WEBHOOK_DOMAIN
        sync: false
      - key: WEBHOOK_PATH
        value: /api/telegram/webhook
      - key: WEBHOOK_SECRET
        sync: false
      - key: CRON_SECRET
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: cyber-bot-db
          property: connectionString
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini
      - key: DEFAULT_MODE
        value: normal

databases:
  - name: cyber-bot-db
    plan: free
